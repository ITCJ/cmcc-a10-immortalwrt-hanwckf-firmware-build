name: Build U-Boot

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/hanwckf/bl-mt798x.git
  REPO_BRANCH: master
  UBOOT_FIX_PR_REF: pull/169/head
  UBOOT_FIX_COMMIT: 8edae2affbbdf3046be10148199fd9589d5616c4
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build U-Boot
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    strategy:
      matrix:
        board: [cmcc_a10]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get -qq install gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler

          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /srcdir
          sudo chown $USER:$GROUPS /srcdir

      - name: Clone Source Repository
        working-directory: /srcdir
        run: |
          echo "Free space:"
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH u-boot
          ln -sf /srcdir/u-boot $GITHUB_WORKSPACE/u-boot

      - name: Apply UBI rebuild fix
        run: |
          cd u-boot
          git fetch origin "$UBOOT_FIX_PR_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$UBOOT_FIX_COMMIT"
          git cherry-pick --no-commit FETCH_HEAD
          git diff --cached --check

      - name: Compile U-Boot
        id: compile
        run: |
          cd u-boot
          SOC=mt7981 BOARD=${{ matrix.board }} MULTI_LAYOUT=0 FIXED_MTDPARTS=1 ./build.sh
          (cd output && sha256sum * > sha256sums)

          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: u-boot_bin_${{ matrix.board }}${{ env.FILE_DATE }}
          path: u-boot/output

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=U-Boot_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "U-Boot 🌝 cmcc a10" >> release.txt
          echo "Includes hanwckf/bl-mt798x#169 UBI rebuild fix ($UBOOT_FIX_COMMIT)." >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: u-boot/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outputs.status == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
